<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stroke Risk Assessment</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Outfit', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
}

.btn {
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
}
</style>
</head>

<body class="p-6">
<div class="flex items-center gap-4 mb-6">

  <button onclick="goBack()" 
    class="text-xl px-3 py-1 rounded-lg bg-gray-800 hover:bg-gray-700">
    ←
  </button>

  <h1 class="text-2xl text-cyan-400 font-semibold">
    🫀 Stroke Risk Assessment
  </h1>

</div>

<form id="form" class="grid md:grid-cols-2 gap-6">

<!-- AGE -->
<div class="card p-4 rounded-xl">
  <label>Age</label>
  <input type="number" id="age" min="18" max="90"
    class="w-full p-2 mt-2 bg-gray-800 rounded" required>
</div>

<!-- SYMPTOMS -->
<div class="card p-4 rounded-xl col-span-2">
  <h3 class="mb-4 text-cyan-400">Symptoms</h3>

  <div class="grid grid-cols-2 md:grid-cols-3 gap-3">

    <label><input type="checkbox" id="chest_pain"> Chest Pain</label>
    <label><input type="checkbox" id="breath"> Shortness of Breath</label>
    <label><input type="checkbox" id="heartbeat"> Irregular Heartbeat</label>
    <label><input type="checkbox" id="fatigue"> Fatigue / Weakness</label>
    <label><input type="checkbox" id="dizziness"> Dizziness</label>
    <label><input type="checkbox" id="swelling"> Swelling (Legs/Feet)</label>
    <label><input type="checkbox" id="radiating_pain"> Neck/Jaw/Back Pain</label>
    <label><input type="checkbox" id="sweating"> Excessive Sweating</label>
    <label><input type="checkbox" id="cough"> Persistent Cough</label>
    <label><input type="checkbox" id="nausea"> Nausea / Vomiting</label>
    <label><input type="checkbox" id="bp"> High Blood Pressure</label>
    <label><input type="checkbox" id="activity_pain"> Chest Pain (Activity)</label>
    <label><input type="checkbox" id="cold"> Cold Hands/Feet</label>
    <label><input type="checkbox" id="sleep"> Sleep Apnea / Snoring</label>
    <label><input type="checkbox" id="anxiety"> Anxiety / Panic Feeling</label>

  </div>
</div>

<!-- SUBMIT -->
<div class="col-span-2 text-center mt-6">
  <button type="submit" class="btn px-10 py-3 rounded-xl font-semibold">
    Predict Stroke Risk
  </button>
</div>

</form>

<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    "Age": parseInt(document.getElementById("age").value),

    "Chest Pain": document.getElementById("chest_pain").checked ? 1 : 0,
    "Shortness of Breath": document.getElementById("breath").checked ? 1 : 0,
    "Irregular Heartbeat": document.getElementById("heartbeat").checked ? 1 : 0,
    "Fatigue & Weakness": document.getElementById("fatigue").checked ? 1 : 0,
    "Dizziness": document.getElementById("dizziness").checked ? 1 : 0,
    "Swelling (Edema)": document.getElementById("swelling").checked ? 1 : 0,
    "Pain in Neck/Jaw/Shoulder/Back": document.getElementById("radiating_pain").checked ? 1 : 0,
    "Excessive Sweating": document.getElementById("sweating").checked ? 1 : 0,
    "Persistent Cough": document.getElementById("cough").checked ? 1 : 0,
    "Nausea/Vomiting": document.getElementById("nausea").checked ? 1 : 0,
    "High Blood Pressure": document.getElementById("bp").checked ? 1 : 0,
    "Chest Discomfort (Activity)": document.getElementById("activity_pain").checked ? 1 : 0,
    "Cold Hands/Feet": document.getElementById("cold").checked ? 1 : 0,
    "Snoring/Sleep Apnea": document.getElementById("sleep").checked ? 1 : 0,
    "Anxiety/Feeling of Doom": document.getElementById("anxiety").checked ? 1 : 0
  };

  try {
    const res = await fetch("http://127.0.0.1:8000/predict-stroke", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    // ✅ STORE RESULT (same format as others)
    localStorage.setItem("result_data", JSON.stringify({
      disease: "Stroke",
      data: result.data
    }));

    // ✅ REDIRECT TO COMMON RESULT PAGE
    window.location.href = "../result.html";

  } catch (err) {
    alert("Server error ❌");
  }
});

// OPTIONAL (if not already defined somewhere)
function goBack() {
  window.location.href = "../dashboard.html";
}
</script>

</body>
</html>
