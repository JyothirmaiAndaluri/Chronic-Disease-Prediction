<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diabetes Assessment</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Outfit', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
}

.btn {
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
}
</style>
</head>

<body class="p-6">
<div class="flex items-center gap-4 mb-6">

  <button onclick="goBack()" 
    class="text-xl px-3 py-1 rounded-lg bg-gray-800 hover:bg-gray-700">
    ←
  </button>

  <h1 class="text-2xl text-cyan-400 font-semibold">
    💉 Diabetes Assessment
  </h1>

</div>

<form id="form" class="grid md:grid-cols-2 gap-6">

<!-- AGE -->
<div class="card p-4 rounded-xl">
  <label>Age</label>
  <input type="number" id="age" min="1" max="120"
    class="w-full p-2 mt-2 bg-gray-800 rounded" required>
</div>

<!-- GENDER -->
<div class="card p-4 rounded-xl">
  <label>Gender</label>
  <select id="gender" class="w-full p-2 mt-2 bg-gray-800 rounded">
    <option value="1">Male</option>
    <option value="0">Female</option>
  </select>
</div>

<!-- SYMPTOMS -->
<div class="card p-4 rounded-xl col-span-2">
  <h3 class="mb-4 text-cyan-400">Symptoms</h3>

  <div class="grid grid-cols-2 md:grid-cols-3 gap-3">

    <label><input type="checkbox" id="frequent_urination"> Frequent Urination</label>
    <label><input type="checkbox" id="excessive_thirst"> Excessive Thirst</label>
    <label><input type="checkbox" id="weight_loss"> Sudden Weight Loss</label>
    <label><input type="checkbox" id="weakness"> Weakness</label>
    <label><input type="checkbox" id="excessive_hunger"> Excessive Hunger</label>
    <label><input type="checkbox" id="infection"> Genital Infection</label>
    <label><input type="checkbox" id="blurred_vision"> Blurred Vision</label>
    <label><input type="checkbox" id="itching"> Skin Itching</label>
    <label><input type="checkbox" id="irritability"> Irritability</label>
    <label><input type="checkbox" id="slow_healing"> Slow Wound Healing</label>
    <label><input type="checkbox" id="weak_muscles"> Partial Weakness</label>
    <label><input type="checkbox" id="stiff_muscles"> Muscle Stiffness</label>
    <label><input type="checkbox" id="hair_loss"> Hair Loss</label>
    <label><input type="checkbox" id="obesity"> Obesity</label>

  </div>
</div>

<!-- SUBMIT -->
<div class="col-span-2 text-center mt-6">
  <button type="submit" class="btn px-10 py-3 rounded-xl font-semibold">
    Predict Diabetes Risk
  </button>
</div>

</form>

<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    "Age": parseInt(age.value),
    "Gender": gender.value === "1" ? 2 : 1,

    "Polyuria": frequent_urination.checked ? 2 : 1,
    "Polydipsia": excessive_thirst.checked ? 2 : 1,
    "sudden weight loss": weight_loss.checked ? 2 : 1,
    "weakness": weakness.checked ? 2 : 1,
    "Polyphagia": excessive_hunger.checked ? 2 : 1,
    "Genital thrush": infection.checked ? 2 : 1,
    "visual blurring": blurred_vision.checked ? 2 : 1,
    "Itching": itching.checked ? 2 : 1,
    "Irritability": irritability.checked ? 2 : 1,
    "delayed healing": slow_healing.checked ? 2 : 1,
    "partial paresis": weak_muscles.checked ? 2 : 1,
    "muscle stiffness": stiff_muscles.checked ? 2 : 1,
    "Alopecia": hair_loss.checked ? 2 : 1,
    "Obesity": obesity.checked ? 2 : 1
  };

  try {
    const res = await fetch("http://127.0.0.1:8000/predict-diabetes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await res.json();
    

    // ✅ STORE RESULT
    localStorage.setItem("result_data", JSON.stringify({
      disease: "Diabetes",
      data: result.data
    }));

    // ✅ REDIRECT TO COMMON PAGE
    window.location.href = "../result.html";

  } catch (err) {
    alert("Server error ❌");
  }
});
</script>
</body>
</html>
