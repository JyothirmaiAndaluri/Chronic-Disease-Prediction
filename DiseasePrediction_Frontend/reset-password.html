<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  font-family: 'Outfit', sans-serif;
}

.glass {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.1);
}

.input {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
}

.input:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 10px rgba(56,189,248,0.3);
  outline: none;
}

.btn {
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  transition: 0.3s;
}

.btn:hover {
  transform: translateY(-2px);
}

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #22c55e;
  padding: 12px 20px;
  border-radius: 10px;
  display: none;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<!-- Toast -->
<div id="toast" class="toast">Password updated successfully</div>

<div class="glass p-10 rounded-3xl w-96 shadow-2xl">

<h2 class="text-2xl mb-6 text-center font-semibold">Create New Password</h2>

<form onsubmit="handleReset(event)" class="space-y-4">

<input type="password" id="newPassword" placeholder="New Password"
class="input w-full p-4 rounded-xl">

<p id="error1" class="text-red-400 text-sm hidden"></p>

<input type="password" id="confirmPassword" placeholder="Confirm Password"
class="input w-full p-4 rounded-xl">

<p id="error2" class="text-red-400 text-sm hidden"></p>

<button id="btn" type="submit" class="btn w-full py-3 rounded-xl font-semibold">
Update Password
</button>

</form>

<p class="text-center mt-6 text-cyan-400 cursor-pointer"
onclick="window.location.href='login.html'">
Back to Login
</p>

</div>

<script>
const BASE_URL = "http://127.0.0.1:8000/auth";

function showToast(){
  const toast = document.getElementById("toast");
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 3000);
}

async function handleReset(e){
  e.preventDefault();

  const newPassword = document.getElementById("newPassword");
  const confirmPassword = document.getElementById("confirmPassword");

  const error1 = document.getElementById("error1");
  const error2 = document.getElementById("error2");

  error1.classList.add("hidden");
  error2.classList.add("hidden");

  let valid = true;

  // validation
  if (newPassword.value.length < 6) {
    error1.innerText = "Password must be at least 6 characters";
    error1.classList.remove("hidden");
    valid = false;
  }

  if (newPassword.value !== confirmPassword.value) {
    error2.innerText = "Passwords do not match";
    error2.classList.remove("hidden");
    valid = false;
  }

  if (!valid) return;

  const email = localStorage.getItem("resetEmail");

  if (!email) {
    error1.innerText = "Session expired. Try again.";
    error1.classList.remove("hidden");
    return;
  }

  // loading state
  const btn = document.getElementById("btn");
  btn.innerText = "Updating...";
  btn.disabled = true;

  try {
    const res = await fetch(`${BASE_URL}/reset-password`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        email: email,
        new_password: newPassword.value
      })
    });

    const data = await res.json();

    if (data.message) {
      showToast();

      localStorage.removeItem("resetEmail");

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    } else {
      error1.innerText = data.error;
      error1.classList.remove("hidden");
    }

  } catch {
    error1.innerText = "Server error. Try again.";
    error1.classList.remove("hidden");
  }

  btn.innerText = "Update Password";
  btn.disabled = false;
}
</script>

</body>
</html>
