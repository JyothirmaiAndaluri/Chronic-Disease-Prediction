<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analytics - PrediHealth</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Outfit', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
}

.glass {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px;
}

</style>
</head>

<body class="p-6 max-w-6xl mx-auto">
<!-- HEADER -->
<!-- HEADER -->
<div class="flex items-center justify-between mb-8">

  <!-- LEFT SIDE -->
  <div class="flex items-center gap-4">
    <button onclick="goBack()" 
      class="px-3 py-1 bg-gray-800 rounded hover:bg-gray-700">
      ←
    </button>

    <h1 class="text-3xl text-cyan-400 font-semibold">
      📊 Analytics Dashboard
    </h1>
  </div>

</div>

<!-- SUMMARY CARDS -->
<div class="grid md:grid-cols-2 gap-6">

  <div class="card text-center">
    <p class="text-gray-400">Total Users</p>
    <h2 id="users" class="text-4xl font-bold text-cyan-400 mt-2">0</h2>
  </div>

  <div class="card text-center">
    <p class="text-gray-400">Total Logins</p>
    <h2 id="logins" class="text-4xl font-bold text-green-400 mt-2">0</h2>
  </div>

</div>

<div class="glass p-6 rounded-2xl mt-8">

  <h2 class="text-xl text-cyan-400 mb-6 font-semibold text-center">
    Disease Usage Analytics
  </h2>

  <!-- ✅ CENTER WRAPPER -->
  <div class="flex justify-center items-center">
    
    <div style="width: 350px; height: 350px;">
      <canvas id="diseaseChart"></canvas>
    </div>

  </div>

</div>

<script>
function goBack() {
  window.location.href = "dashboard.html";
}
fetch("http://localhost:8000/analytics")
.then(res => res.json())
.then(data => {

  // Users & Logins
  document.getElementById("users").innerText = data.total_users;
  document.getElementById("logins").innerText = data.total_logins;

  // Prepare chart data
  const labels = data.disease_stats.map(d => d.disease);
  const values = data.disease_stats.map(d => d.count);

  // Create chart
  const ctx = document.getElementById('diseaseChart').getContext('2d');

  new Chart(ctx, {
    type: 'pie',
    data: {
      labels: labels,
      datasets: [{
        label: 'Number of Predictions',
        data: values,
        borderWidth: 1
      }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: {
            color: 'white'
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: 'white'
          }
        },
        y: {
          ticks: {
            color: 'white'
          },
          beginAtZero: true
        }
      }
    }
  });

});

</script>

</body>
</html>
