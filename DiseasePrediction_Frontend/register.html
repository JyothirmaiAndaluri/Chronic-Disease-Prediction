<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - PrediHealth</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  font-family: 'Outfit', sans-serif;
}
.glass { background: rgba(255,255,255,0.06); }
.input {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn {
  background: linear-gradient(135deg, #38bdf8, #6366f1);
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<div class="glass p-10 rounded-3xl w-96">

<h2 class="text-2xl text-center mb-6">Register</h2>

<form onsubmit="handleRegister(event)" class="space-y-4">

<input type="text" placeholder="Name" class="input w-full p-4 rounded-xl" required>
<input type="number" placeholder="Age" class="input w-full p-4 rounded-xl" required>
<input type="text" placeholder="Phone" class="input w-full p-4 rounded-xl" required>
<input type="email" placeholder="Email" class="input w-full p-4 rounded-xl" required>
<input type="password" placeholder="Password" class="input w-full p-4 rounded-xl" required>

<p id="error" class="text-red-400 text-sm hidden"></p>

<button id="btn" class="btn w-full py-3 rounded-xl">Create Account</button>

</form>

</div>

<script>
const BASE_URL = "http://127.0.0.1:8000/auth";

async function handleRegister(e){
  e.preventDefault();

  const inputs = document.querySelectorAll("input");

  const name = inputs[0].value;
  const age = inputs[1].value;
  const phone = inputs[2].value;
  const email = inputs[3].value;
  const password = inputs[4].value;

  const error = document.getElementById("error");
  error.classList.add("hidden");

  if (password.length < 6) {
    error.innerText = "Password too short";
    error.classList.remove("hidden");
    return;
  }

  const btn = document.getElementById("btn");
  btn.innerText = "Creating...";
  btn.disabled = true;

  try {
    const res = await fetch(`${BASE_URL}/register`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ name, age, phone, email, password })
    });

    const data = await res.json();

    if (data.message) {
      window.location.href = "login.html";
    } else {
      error.innerText = data.error;
      error.classList.remove("hidden");
    }

  } catch {
    error.innerText = "Server error";
    error.classList.remove("hidden");
  }

  btn.innerText = "Create Account";
  btn.disabled = false;
}
</script>

</body>
</html>
