<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  font-family: 'Outfit', sans-serif;
}
.glass { background: rgba(255,255,255,0.06); }
.input {
  background: rgba(255,255,255,0.05);
}
.btn {
  background: linear-gradient(135deg, #38bdf8, #6366f1);
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<div class="glass p-10 rounded-3xl w-96 text-center">

<h2 class="text-xl mb-6">Enter your email</h2>

<form onsubmit="handleForgot(event)" class="space-y-4">

<input type="email" placeholder="Email"
class="input w-full p-4 rounded-xl" required>

<p id="error" class="text-red-400 text-sm hidden"></p>

<button id="btn" class="btn w-full py-3 rounded-xl">
Send Reset Link
</button>

</form>

</div>

<script>
const BASE_URL = "http://127.0.0.1:8000/auth";

async function handleForgot(e){
  e.preventDefault();

  const email = document.querySelector("input").value;
  const error = document.getElementById("error");
  error.classList.add("hidden");

  const btn = document.getElementById("btn");
  btn.innerText = "Checking...";
  btn.disabled = true;

  try {
    const res = await fetch(`${BASE_URL}/forgot-password`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if (data.message) {
      localStorage.setItem("resetEmail", email);
      window.location.href = "reset-password.html";
    } else {
      error.innerText = data.error;
      error.classList.remove("hidden");
    }

  } catch {
    error.innerText = "Server error";
    error.classList.remove("hidden");
  }

  btn.innerText = "Send Reset Link";
  btn.disabled = false;
}
</script>

</body>
</html>
