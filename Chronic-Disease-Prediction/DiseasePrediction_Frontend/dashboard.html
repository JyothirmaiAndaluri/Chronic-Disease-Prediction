<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - PrediHealth</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Outfit', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
}

.glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.section {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  transition: all 0.3s ease;
}

.card:hover {
  transform: translateY(-6px) scale(1.03);
  border-color: rgba(56,189,248,0.5);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="glass px-8 py-4 flex justify-between items-center">

  <h1 class="text-2xl font-bold text-cyan-400">🧬 PrediHealth</h1>

  <div class="flex items-center gap-6">

    <a href="#" class="text-cyan-400">Dashboard</a>
    <a href="analytics.html" class="text-gray-300 hover:text-cyan-400">Analytics</a>

    <!-- ✅ FIXED PROFILE ICON -->
    <div onclick="goProfile()" 
      class="w-10 h-10 rounded-full flex items-center justify-center cursor-pointer border border-gray-600 hover:border-cyan-400 transition bg-gray-800 text-lg">
      👤
    </div>

    <button onclick="logout()" class="text-red-400">Logout</button>

  </div>

</nav>

<!-- MAIN -->
<div class="px-6 py-10 max-w-6xl mx-auto">

  <!-- Heading -->
  <h1 id="greeting" class="text-3xl mb-2">Hello 👋</h1>
  <p class="text-gray-400 mb-8">Select a condition to start your assessment</p>

  <!-- SECTION -->
  <div class="section p-6">

    <h2 class="text-xl mb-6 font-semibold text-cyan-400">
      Available Health Assessments
    </h2>

    <!-- GRID -->
    <div id="diseaseGrid" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6"></div>

  </div>

</div>

<script>

/* ================= USER ================= */

const user = JSON.parse(localStorage.getItem("user")) || {
  name: "User"
};

document.getElementById("greeting").innerText = `Hello, ${user.name} 👋`;


/* ================= DISEASES ================= */

const diseases = [
  { name: "Alzheimer’s", icon: "🧠", desc: "Cognitive Health" },
  { name: "Diabetes", icon: "💉", desc: "Metabolic Risk" },
  { name: "Stroke", icon: "🫀", desc: "Vascular Risk" },
  { name: "Lung Cancer", icon: "🫁", desc: "Oncological Risk" },
  { name: "Migraine", icon: "🧠", desc: "Neurological Risk" }
];

const grid = document.getElementById("diseaseGrid");

diseases.forEach((disease, index) => {

  const card = document.createElement("div");

  card.className = "card p-6 rounded-2xl text-center cursor-pointer";

  card.innerHTML = `
    <div class="text-5xl mb-4">${disease.icon}</div>
    <h3 class="text-lg font-semibold">${disease.name}</h3>
    <p class="text-gray-400 text-sm mt-2">${disease.desc}</p>
  `;

  card.onclick = () => startPrediction(index);

  grid.appendChild(card);
});


/* ================= ACTIONS ================= */

function startPrediction(index) {

  const pages = [
    "symptoms/alzheimers.html",
    "symptoms/diabetes.html",
    "symptoms/stroke.html",
    "symptoms/lung.html",
    "symptoms/migraine.html"
  ];

  window.location.href = pages[index];
}

function goProfile() {
  window.location.href = "profile.html";
}

function logout() {
  localStorage.removeItem("user");
  window.location.href = "index.html";
}

</script>

</body>
</html>
